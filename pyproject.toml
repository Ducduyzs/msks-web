[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msks"
version = "0.1.0"
description = "MSKS — tổng hợp kiến thức đa nguồn có kiểm chứng (backend)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "tiktoken>=0.7",
  "openai>=1.40",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Worker: model của v11 (GPU khuyến nghị). API không cần nhóm này.
ml = [
  "torch>=2.3",
  "transformers>=4.44",
  "FlagEmbedding>=1.2",
  "sentence-transformers>=3.0",
  "docling>=2.0",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
